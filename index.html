<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0f15">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Filler">
<meta name="description" content="Fill PDF forms in the browser: text, date, check marks and signatures. Nothing is uploaded.">
<title>Filler</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Allura&family=Caveat:wght@500&family=Dancing+Script:wght@500&family=Great+Vibes&family=Homemade+Apple&family=La+Belle+Aurore&family=Mrs+Saint+Delafield&family=Sacramento&display=swap">
<style>
  /* Tally's tokens, unchanged, so the family of apps looks like one. */
  :root{
    --bg:#0d0f15; --bg2:#11131a; --card:#181b24; --card2:#1f2330; --line:#272b38;
    --txt:#eef1f7; --muted:#8a92a6; --accent:#3b82f6; --accent2:#7cb8ff;
    --good:#4ade80; --bad:#f87171; --warn:#fbbf24; --r:18px; --paper:#ffffff;
    color-scheme:dark;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  [hidden]{display:none!important}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;font-size:14px;}
  body{display:flex;flex-direction:column;height:100dvh;overflow:hidden;touch-action:pan-x pan-y}
  button,select,input{font-family:inherit}
  svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

  /* header: name on the left, file actions on the right */
  header{display:flex;align-items:center;gap:10px;padding:10px max(16px,env(safe-area-inset-right)) 10px max(16px,env(safe-area-inset-left));
    padding-top:calc(10px + env(safe-area-inset-top));background:var(--bg);border-bottom:1px solid var(--line);z-index:20}
  header h1{font-size:20px;margin:0;letter-spacing:.3px;white-space:nowrap}
  header h1 .dot{color:var(--accent)}
  .docname{color:var(--muted);font-size:12px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
  .hdr{display:flex;align-items:center;gap:6px;margin-left:auto}
  .hbtn{background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:11px;height:34px;padding:0 11px;
    display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:600;cursor:pointer;white-space:nowrap}
  .hbtn.icon{width:34px;padding:0;justify-content:center}
  .hbtn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .hbtn:disabled{opacity:.45;cursor:default}
  .hbtn:active{filter:brightness(1.15)}
  .zoom{display:flex;align-items:center;gap:2px}
  .zoom .hbtn{width:30px;padding:0;justify-content:center;font-size:16px}
  .zoom span{min-width:44px;text-align:center;font-size:12px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
  @media (max-width:640px){
    .hbtn .lbl{display:none} .hbtn{padding:0 9px} .zoom{display:none} .docname{display:none}
  }
  :focus-visible{outline:2px solid var(--accent2);outline-offset:2px}

  /* the desk: pages sit on it like paper */
  main{flex:1;overflow:auto;position:relative;padding:16px max(16px,env(safe-area-inset-right)) 28px max(16px,env(safe-area-inset-left));
    overscroll-behavior:contain}
  .banner{max-width:560px;margin:0 auto 14px;display:flex;align-items:center;gap:10px;background:var(--card);
    border:1px solid var(--line);border-radius:14px;padding:9px 12px;font-size:12.5px;color:var(--muted)}
  .banner b{color:var(--txt)}
  .banner .chip{background:rgba(59,130,246,.16);color:var(--accent2);font-weight:700;font-size:10px;letter-spacing:.6px;
    text-transform:uppercase;padding:3px 7px;border-radius:6px;flex:none}
  .banner .hbtn{margin-left:auto;height:28px;font-size:12.5px;flex:none}
  #pages{display:flex;flex-direction:column;align-items:center;gap:18px;width:max-content;min-width:100%;transform-origin:0 0}
  .page{position:relative;background:var(--paper);box-shadow:0 2px 18px rgba(0,0,0,.55);flex:none}
  .page canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  .page .pno{position:absolute;top:100%;right:0;margin-top:3px;font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums}
  .layer{position:absolute;inset:0}
  body[data-tool=text] .layer,body[data-tool=date] .layer{cursor:text}
  body[data-tool=check] .layer,body[data-tool=cross] .layer,body[data-tool=sign] .layer{cursor:crosshair}
  .empty{text-align:center;color:var(--muted);padding-top:18vh;font-size:15px}

  /* placed items */
  .item{position:absolute;touch-action:none;cursor:move;border-radius:2px}
  .item::after{content:"";position:absolute;inset:-4px;border-radius:3px;pointer-events:none}
  @media (hover:hover){.item:hover::after{outline:1px dashed rgba(59,130,246,.6)}}
  .item.sel::after{outline:1.5px solid var(--accent)}
  .item .txt{font-family:Helvetica,Arial,"Liberation Sans",sans-serif;line-height:1.2;white-space:pre;min-width:1.5ch;
    outline:none;cursor:move;padding:0;margin:0;-webkit-user-select:text;user-select:text}
  .item .txt:focus{cursor:text}
  .item .txt:empty::before{content:"Type here";color:#8a93a3}
  .item svg,.item img{display:block;width:100%;height:100%;pointer-events:none;user-select:none;-webkit-user-select:none}
  /* Resize handle: an outline only, just outside the corner, so what's under it stays readable.
     A wider invisible area keeps it easy to grab, more so on touch screens. */
  .item .rs{position:absolute;display:none;right:-13px;bottom:-13px;width:11px;height:11px;border-radius:3px;
    background:transparent;border:1.5px solid rgba(59,130,246,.75);cursor:nwse-resize}
  .item .rs::before{content:"";position:absolute;inset:-9px}
  @media (pointer:coarse){.item .rs{width:15px;height:15px;right:-17px;bottom:-17px} .item .rs::before{inset:-14px}}
  .item.sel .rs{display:block}
  .item.drag{opacity:.85}

  /* the options strip, above the tools: what the current tool or item can change */
  .optbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-height:46px;
    padding:6px max(16px,env(safe-area-inset-right)) 6px max(16px,env(safe-area-inset-left));
    background:var(--bg2);border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}
  .optbar .hint{flex:1;min-width:0}
  .opt{display:flex;align-items:center;gap:6px}
  .opt .lab{font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;font-weight:600}
  .sw{width:24px;height:24px;border-radius:50%;border:2px solid var(--bg2);box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}
  .sw.on{box-shadow:0 0 0 2px var(--accent2)}
  .gbtn{background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:9px;height:30px;min-width:30px;padding:0 9px;
    font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
  .gbtn.danger{border-color:var(--bad);color:var(--bad);background:var(--bg2)}
  .gbtn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .num{min-width:24px;text-align:center;font-weight:600;color:var(--txt);font-variant-numeric:tabular-nums}
  select{background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:9px;height:30px;padding:0 8px;font-size:13px}
  .sigchip{display:flex;align-items:center;gap:8px;background:var(--card2);border:1px solid var(--line);border-radius:10px;
    padding:3px 10px 3px 3px;cursor:pointer;color:var(--txt);font-weight:600;font-size:13px;max-width:100%}
  .sigchip .th{background:var(--paper);border-radius:7px;height:30px;width:74px;display:grid;place-items:center;padding:2px 4px;flex:none}
  .sigchip .th img{max-width:100%;max-height:100%}
  .optbar .end{margin-left:auto;display:flex;gap:6px}

  /* the bottom bar, as in Tally: the tools, the one in use in blue */
  nav{display:flex;justify-content:space-around;background:rgba(17,19,26,.96);border-top:1px solid var(--line);
    padding:7px max(4px,env(safe-area-inset-right)) calc(7px + env(safe-area-inset-bottom)) max(4px,env(safe-area-inset-left));z-index:30}
  nav button{background:none;border:none;color:var(--muted);font-size:10px;font-weight:600;white-space:nowrap;display:flex;flex-direction:column;
    align-items:center;gap:3px;cursor:pointer;padding:4px 1px;flex:1;min-width:0;max-width:110px}
  nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  nav button.active{color:var(--accent)}
  nav kbd{display:none}
  @media (hover:hover) and (min-width:800px){
    nav button{flex-direction:row;gap:7px;font-size:13px;justify-content:center}
    nav kbd{display:inline;font:600 10px/1 system-ui;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:2px 4px}
  }

  /* a widget over the bottom of the screen, as in Slate */
  .sheetwrap{position:fixed;inset:0;z-index:40}
  .scrim{position:absolute;inset:0;background:rgba(0,0,0,.55)}
  .sheet{position:absolute;left:0;right:0;bottom:0;max-height:88dvh;background:var(--card);
    border-top:1px solid var(--line);border-radius:20px 20px 0 0;
    padding:14px max(16px,env(safe-area-inset-right)) calc(14px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));
    display:flex;flex-direction:column;gap:10px;overflow-y:auto;max-width:560px;margin:0 auto}
  .sheet.enter{animation:up .28s cubic-bezier(.2,.8,.2,1)}
  @keyframes up{from{transform:translateY(100%)}to{transform:none}}
  @media (prefers-reduced-motion:reduce){.sheet.enter{animation:none}}
  .sheet h3{margin:0;font-size:16px}
  .sheet .sub{margin:-6px 0 0;color:var(--muted);font-size:12.5px;line-height:1.4}
  .sheet .foot{display:flex;gap:8px;padding-top:4px}
  .btn{background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:11px;padding:11px 14px;
    font-size:14px;font-weight:600;cursor:pointer;flex:1}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.close{flex:0 0 auto;min-width:92px;background:var(--bg2)}
  .btn:disabled{opacity:.45;cursor:default}
  .sec{font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:600;margin-top:2px}
  input[type=text]{width:100%;background:var(--bg2);border:1px solid var(--line);color:var(--txt);border-radius:10px;
    padding:9px 11px;font-size:16px;outline:none}
  input[type=text]:focus{border-color:var(--accent)}

  .siglist{display:flex;flex-direction:column;gap:8px}
  .sigrow{display:flex;align-items:center;gap:10px;background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:8px}
  .sigrow.on{border-color:var(--accent)}
  .sigrow .pick{display:flex;align-items:center;gap:12px;flex:1;min-width:0;background:none;border:none;color:var(--txt);cursor:pointer;padding:0;text-align:left}
  .sigrow .th{background:var(--paper);border-radius:10px;height:56px;width:150px;display:grid;place-items:center;padding:5px 8px;flex:none}
  .sigrow .th img{max-width:100%;max-height:100%}
  .sigrow .nm{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sigrow .nm small{display:block;color:var(--muted);font-weight:500;font-size:11.5px;margin-top:2px}
  .sigrow .x{flex:none;background:var(--bg);border:1px solid var(--line);color:var(--muted);border-radius:9px;height:32px;padding:0 10px;
    cursor:pointer;font-weight:600;font-size:12.5px}
  .sigrow .x.arm{background:var(--bad);border-color:var(--bad);color:#fff}
  .emptysig{color:var(--muted);font-size:13px;background:var(--bg2);border:1px dashed var(--line);border-radius:14px;padding:16px;text-align:center}

  .seg{display:flex;background:var(--bg2);border:1px solid var(--line);border-radius:11px;padding:3px;gap:3px}
  .seg button{flex:1;background:none;border:none;color:var(--muted);border-radius:8px;padding:8px 4px;font-weight:600;font-size:13px;cursor:pointer}
  .seg button.on{background:var(--card2);color:var(--txt)}
  .padwrap{position:relative;background:var(--paper);border-radius:12px;overflow:hidden}
  #pad{display:block;width:100%;height:190px;touch-action:none;cursor:crosshair}
  .padwrap .base{position:absolute;left:22px;right:22px;bottom:46px;border-bottom:1px solid #c9ced8;pointer-events:none}
  .padwrap .xm{position:absolute;left:22px;bottom:50px;color:#9aa1ad;font-size:16px;pointer-events:none}
  .padwrap .clr{position:absolute;top:8px;right:8px;background:#eef1f6;border:1px solid #d5dae3;color:#3a4150;border-radius:8px;
    height:28px;padding:0 10px;font-weight:600;font-size:12px;cursor:pointer}
  .fonts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .fonts button{background:var(--paper);color:#15171c;border:2px solid transparent;border-radius:12px;height:62px;padding:0 10px;
    font-size:25px;cursor:pointer;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  .fonts button.on{border-color:var(--accent)}
  .upbox{background:var(--paper);border-radius:12px;min-height:150px;display:grid;place-items:center;padding:10px;color:#6b7280;font-size:13px;text-align:center}
  .upbox canvas{max-width:100%;max-height:180px;display:block}
  .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .row label{font-size:12.5px;color:var(--muted)}
  input[type=range]{flex:1;min-width:120px;accent-color:var(--accent)}

  .drop{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(59,130,246,.18);pointer-events:none}
  .drop div{background:var(--card);border:2px dashed var(--accent);border-radius:16px;padding:26px 36px;font-weight:700;font-size:17px;color:var(--accent2)}
  .toast{position:fixed;left:50%;bottom:calc(130px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--card2);
    border:1px solid var(--line);color:var(--txt);padding:9px 14px;border-radius:11px;font-size:13px;font-weight:600;z-index:60;
    max-width:calc(100% - 32px);box-shadow:0 8px 26px rgba(0,0,0,.5);text-align:center}
  .help{font-size:12px;color:var(--muted);text-align:center;margin:16px auto 0;max-width:62ch;line-height:1.55}

  /* About: opened from the name, as in Tally */
  header h1{cursor:pointer;user-select:none;-webkit-user-select:none;border-radius:6px}
  .rows .row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
  .rows .row:last-child{border-bottom:0}
  .row .k{font-size:13.5px} .row .v{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
  .row .v.ok{color:var(--good)} .row .v.warn{color:var(--warn)}
  .btnrow{display:flex;gap:8px}
  .howto{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:13px;line-height:1.5}
  .howto ol{margin:6px 0 0;padding-left:20px} .howto li{margin:3px 0}
  .howto b{color:var(--txt)}
  .phone{display:flex;gap:14px;align-items:center}
  .phone canvas{background:#fff;border-radius:10px;padding:8px;width:132px;height:132px;flex:none;image-rendering:pixelated}
  .phone .url{color:var(--accent2);font-weight:600;word-break:break-all}
</style>
</head>
<body>
<header>
  <h1 id="appTitle" role="button" tabindex="0" title="About Filler">Filler<span class="dot">.</span></h1>
  <span class="docname" id="docname"></span>
  <div class="hdr">
    <label class="hbtn" for="file" title="Open a PDF (or drop one on the window)">
      <svg class="i" viewBox="0 0 24 24"><path d="M4 19V6a2 2 0 0 1 2-2h4l2 2h6a2 2 0 0 1 2 2v11a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1z"/></svg><span class="lbl">Open</span>
    </label>
    <button class="hbtn icon" id="undo" title="Undo (Ctrl+Z)" aria-label="Undo"><svg class="i" viewBox="0 0 24 24"><path d="M9 7L4 12l5 5M4 12h11a5 5 0 0 1 0 10h-2"/></svg></button>
    <div class="zoom"><button class="hbtn" id="zoomOut" aria-label="Zoom out">−</button><span id="zoomVal">100%</span><button class="hbtn" id="zoomIn" aria-label="Zoom in">+</button></div>
    <button class="hbtn primary" id="save" title="Download the filled PDF">
      <svg class="i" viewBox="0 0 24 24"><path d="M12 4v11M7 10.5l5 5 5-5M5 20h14"/></svg><span class="lbl">Download</span>
    </button>
  </div>
</header>

<main id="work">
  <div class="banner" id="banner" hidden>
    <span class="chip">Sample</span>
    <span><b>Sample form.</b> Try the tools, then open your PDF.</span>
    <label class="hbtn" for="file">Open PDF</label>
  </div>
  <div id="pages"><div class="empty">Loading…</div></div>
  <p class="help">Drag anything to move it, or its corner square to resize. Size and Delete are also in the strip above the tools. Pinch to zoom on a phone. Your PDF never leaves this device.</p>
</main>

<div class="optbar" id="optbar"></div>

<nav id="tools" aria-label="Tools">
  <button data-tool="select" title="Select / move (V)"><svg viewBox="0 0 24 24"><path d="M6 3.5l12 7.2-5.3 1.4-2.3 5.4z"/></svg><span>Select</span><kbd>V</kbd></button>
  <button data-tool="text" title="Text (T)"><svg viewBox="0 0 24 24"><path d="M5 7V5h14v2M12 5v14M9 19h6"/></svg><span>Text</span><kbd>T</kbd></button>
  <button data-tool="date" title="Today's date (D)"><svg viewBox="0 0 24 24"><rect x="4" y="5.5" width="16" height="14" rx="2"/><path d="M4 10h16M8.5 3.5v4M15.5 3.5v4"/></svg><span>Date</span><kbd>D</kbd></button>
  <button data-tool="check" title="Check mark (C)"><svg viewBox="0 0 24 24" style="stroke-width:2.4"><path d="M5 12.5l4.5 4.5L19 7"/></svg><span>Check</span><kbd>C</kbd></button>
  <button data-tool="cross" title="X mark (X)"><svg viewBox="0 0 24 24" style="stroke-width:2.4"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg><span>X</span><kbd>X</kbd></button>
  <button data-tool="sign" title="Signature (S)"><svg viewBox="0 0 24 24"><path d="M3 16c2.5 0 3.5-8 6-8s.5 8 3.5 8 2.5-4 4.5-4 1.5 2 4 2M3 20h18"/></svg><span>Sign</span><kbd>S</kbd></button>
</nav>

<div class="sheetwrap" id="sheetwrap" hidden><div class="scrim" id="scrim"></div><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<input type="file" id="file" accept="application/pdf,.pdf" hidden>
<input type="file" id="sigfile" accept="image/*" hidden>
<div class="drop" id="drop" hidden><div>Drop the PDF to open it</div></div>
<div class="toast" id="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const { PDFDocument, StandardFonts, rgb, LineCapStyle } = PDFLib;
// The worker script is loaded above as a plain <script>, so pdf.js runs it on the main thread.
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

const store = {
  get(k, d) { try { const v = localStorage.getItem('qpf.' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('qpf.' + k, JSON.stringify(v)); return true; } catch { return false; } },
  del(k) { try { localStorage.removeItem('qpf.' + k); } catch {} }
};

/* Bump with VERSION in sw.js on every ship. */
const APP_VERSION = '6';
const APP_URL = 'https://jpasserin.github.io/filler/';

const INKS = [['#15171c', 'Black'], ['#1e3fae', 'Blue']];
const S = {
  items: [], sel: null, tool: 'select', scale: 1,
  ink: store.get('ink', '#15171c'),
  textSize: store.get('textSize', 11),
  markSize: store.get('markSize', 11),
  dateFmt: store.get('dateFmt', (navigator.language || 'en-US') === 'en-US' ? 'mdy' : 'dmy'),
};

/* Saved signatures: [{id, name, src (PNG data URL), aspect, kind}] kept in this browser. */
let sigs = store.get('sigs', null);
if (!sigs) {
  sigs = [];
  const old = store.get('sig', null); // the single signature of the first version
  if (old && old.src) { sigs.push({ id: uid(), name: 'Me', src: old.src, aspect: old.aspect, kind: 'draw' }); store.del('sig'); }
  store.set('sigs', sigs);

  if (!$('#sheetwrap').hidden) { if (e.key === 'Escape') closeSheet(); return; }
  const ed = editingEl();
  if (e.key === 'Escape') { if (ed) ed.blur(); else select(null); setTool('select'); return; }
  if (ed) return;
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); undo(); return; }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const it = selItem();
  if (it && (e.key === 'Delete' || e.key === 'Backspace')) { e.preventDefault(); removeItem(it.id, true); return; }
  if (it && it.type === 'text' && e.key === 'Enter') { e.preventDefault(); focusText(it); return; }
  const arrows = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
  if (it && arrows[e.key]) {
    e.preventDefault(); const st = e.shiftKey ? 10 : 1;
    pushUndo(); it.x += arrows[e.key][0] * st; it.y += arrows[e.key][1] * st; placeEl(it); return;
  }
  const map = { v: 'select', t: 'text', d: 'date', c: 'check', x: 'cross', s: 'sign' };
  const t = map[e.key.toLowerCase()];
  if (t) { e.preventDefault(); setTool(t); }
});

/* ---------------- sheets ---------------- */
const sheet = $('#sheet');
function openSheet(html, onOpen) {
  const wrap = $('#sheetwrap'), was = !wrap.hidden;
  sheet.innerHTML = html; wrap.hidden = false;
  if (!was) { sheet.classList.remove('enter'); void sheet.offsetWidth; sheet.classList.add('enter'); }
  if (onOpen) requestAnimationFrame(onOpen);
}
function closeSheet() {
  $('#sheetwrap').hidden = true; sheet.innerHTML = '';
  if (S.tool === 'sign' && !getSig(activeSig)) setTool('select');
}
$('#scrim').addEventListener('click', closeSheet);

/* ---------------- about ---------------- */
/* Whether the page runs as an installed app rather than a browser tab. */
const standalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
let INSTALL_EVT = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); INSTALL_EVT = e; });

const UA = navigator.userAgent;

function howToInstall() {
  if (IS_IOS) return `<div class="howto"><b>Add Filler to your Home Screen</b><ol>
    <li>Open this page in <b>Safari</b>.</li>
    <li>Tap <b>Share</b> (the square with the arrow).</li>

/* The QR library loads only when About opens on a computer. */
let qrLib = null;
function drawQr() {
  const c = $('#qr'); if (!c) return;
  qrLib = qrLib || new Promise((res, rej) => {
    const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js';
    s.onload = () => res(window.qrcode); s.onerror = rej; document.head.append(s);
  });
  qrLib.then(qrcode => {
    const qr = qrcode(0, 'M'); qr.addData(APP_URL); qr.make();
    const n = qr.getModuleCount(), px = Math.floor(132 / n), size = n * px, off = Math.floor((132 - size) / 2), x = c.getContext('2d');
    x.fillStyle = '#fff'; x.fillRect(0, 0, 132, 132); x.fillStyle = '#06101c';
    for (let r = 0; r < n; r++) for (let q = 0; q < n; q++) if (qr.isDark(r, q)) x.fillRect(off + q * px, off + r * px, px, px);
  }).catch(() => { qrLib = null; c.replaceWith(Object.assign(document.createElement('div'), { className: 'howto', textContent: 'Go online to show the QR code.' })); });
}

/* Clears only Filler's worker and caches: Tally, Slate and the others share this site. */
async function hardReload() {
  try {
    for (const r of await navigator.serviceWorker.getRegistrations()) if (new URL(r.scope).pathname.startsWith('/filler/')) await r.unregister();
    for (const k of await caches.keys()) if (k.startsWith('filler-')) await caches.delete(k);
  } catch {}
  location.reload();
}
sheet.addEventListener('click', async e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.hasAttribute('data-reload')) hardReload();
  else if (b.hasAttribute('data-install')) {
    if (INSTALL_EVT) {
      INSTALL_EVT.prompt();
      try { await INSTALL_EVT.userChoice; } catch {}
      INSTALL_EVT = null; return;
    }
    $('#howto').innerHTML = howToInstall();
  }
});

    <p class="sub">Saved on this device. Pick one, then tap the page where it goes.</p>

    if (activeSig === b.dataset.del) activeSig = sigs[0] ? sigs[0].id : null;
    saveSigs(); openSigSheet(); renderOpts();
  }
});

/* ---------------- signatures: create ---------------- */

const NS = { mode: store.get('sigMode', 'draw'), name: '', ink: S.ink, font: store.get('sigFont', FONTS[0]), typed: '', upImg: null, thr: 160, hasInk: false };

function openNewSig() {

  renderNewSig();
}
function renderNewSig() {

sheet.addEventListener('input', e => {

  else if (e.target.id === 'typed') {
    NS.typed = e.target.value;

});
sheet.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.mode) { NS.mode = b.dataset.mode; store.set('sigMode', NS.mode); NS.hasInk = false; renderNewSig(); }

/* draw */
let pad = null, pctx = null, last = null;
function setupPad() {
  pad = $('#pad'); if (!pad) return;
  const r = pad.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  pad.width = Math.round(r.width * dpr); pad.height = Math.round(r.height * dpr);
  pctx = pad.getContext('2d'); pctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  pctx.lineCap = 'round'; pctx.lineJoin = 'round'; pctx.lineWidth = 2.6; pctx.strokeStyle = NS.ink; pctx.fillStyle = NS.ink;
  NS.hasInk = false;
  pad.addEventListener('pointerdown', e => {
    pad.setPointerCapture(e.pointerId);
    const r = pad.getBoundingClientRect(); last = { x: e.clientX - r.left, y: e.clientY - r.top };
    pctx.beginPath(); pctx.arc(last.x, last.y, 1.3, 0, Math.PI * 2); pctx.fill(); NS.hasInk = true;
  });
  pad.addEventListener('pointermove', e => {
    if (!last) return;
    const r = pad.getBoundingClientRect();
    const evs = (e.getCoalescedEvents && e.getCoalescedEvents().length) ? e.getCoalescedEvents() : [e];
    pctx.beginPath(); pctx.moveTo(last.x, last.y);
    for (const ev of evs) { last = { x: ev.clientX - r.left, y: ev.clientY - r.top }; pctx.lineTo(last.x, last.y); }
    pctx.stroke();
  });
  const end = () => { last = null; };
  pad.addEventListener('pointerup', end); pad.addEventListener('pointercancel', end);
}
function clearPad() { if (!pctx) return; pctx.save(); pctx.setTransform(1, 0, 0, 1, 0, 0); pctx.clearRect(0, 0, pad.width, pad.height); pctx.restore(); NS.hasInk = false; }
function recolorPad() {
  pctx.strokeStyle = NS.ink; pctx.fillStyle = NS.ink;
  pctx.save(); pctx.setTransform(1, 0, 0, 1, 0, 0); pctx.globalCompositeOperation = 'source-in';
  pctx.fillRect(0, 0, pad.width, pad.height); pctx.restore();
}

/* type: render the name in the chosen handwriting font */
async function typedCanvas() {
  const text = NS.typed.trim(); if (!text) return null;
  const size = 140, font = `${size}px "${NS.font}"`;
  try { await document.fonts.load(font, text); } catch {}
  if (!document.fonts.check(font, text)) toast('The handwriting font is still loading. Try again in a moment.');
  const c = document.createElement('canvas'), x = c.getContext('2d');
  x.font = font;
  const w = Math.ceil(x.measureText(text).width);
  c.width = w + size * 1.4; c.height = size * 2.2;
  x.font = font; x.fillStyle = NS.ink; x.textBaseline = 'middle';
  x.fillText(text, size * 0.7, c.height / 2);
  return trimCanvas(c, 8);
}

/* upload: turn a photo or scan into ink on a transparent background */
$('#sigfile').addEventListener('change', e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  const url = URL.createObjectURL(f), img = new Image();
  img.onload = () => {
    const k = Math.min(1, 1400 / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
    const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, 0, 0, c.width, c.height);
    URL.revokeObjectURL(url);
    const d = x.getImageData(0, 0, c.width, c.height);
    const lum = new Uint8ClampedArray(c.width * c.height), hist = new Array(256).fill(0);
    for (let i = 0; i < lum.length; i++) {
      const v = Math.round(0.299 * d.data[i * 4] + 0.587 * d.data[i * 4 + 1] + 0.114 * d.data[i * 4 + 2]);
      lum[i] = v; hist[v]++;
    }
    NS.upImg = { w: c.width, h: c.height, lum };
    NS.thr = clamp(otsu(hist, lum.length) + 10, 60, 235);
    if (!NS.name) NS.name = (sheet.querySelector('#signame') || {}).value || '';
    renderNewSig();
  };
  img.onerror = () => { URL.revokeObjectURL(url); toast('That image could not be opened. Try a JPG or PNG.'); };
  img.src = url;
});
function otsu(hist, total) {
  let sum = 0; for (let i = 0; i < 256; i++) sum += i * hist[i];
  let sumB = 0, wB = 0, best = 0, thr = 128;
  for (let t = 0; t < 256; t++) {
    wB += hist[t]; if (!wB) continue;
    const wF = total - wB; if (!wF) break;
    sumB += t * hist[t];
    const mB = sumB / wB, mF = (sum - sumB) / wF, between = wB * wF * (mB - mF) ** 2;
    if (between > best) { best = between; thr = t; }
  }
  return thr;
}
function uploadCanvas() {
  const u = NS.upImg; if (!u) return null;
  const c = document.createElement('canvas'); c.width = u.w; c.height = u.h;
  const x = c.getContext('2d'), out = x.createImageData(u.w, u.h), [r, g, b] = hexRgb(NS.ink);
  const t = NS.thr, soft = Math.max(12, t * 0.3);
  for (let i = 0; i < u.lum.length; i++) {
    const a = clamp((t - u.lum[i]) / soft, 0, 1);
    out.data[i * 4] = r; out.data[i * 4 + 1] = g; out.data[i * 4 + 2] = b; out.data[i * 4 + 3] = Math.round(a * 255);
  }
  x.putImageData(out, 0, 0);
  return c;
}
function drawUpload() {
  const cv = $('#upcv'); if (!cv) return;
  const c = uploadCanvas(); cv.width = c.width; cv.height = c.height;
  cv.getContext('2d').drawImage(c, 0, 0);
}

async function saveNewSig() {
  let c = null;
  if (NS.mode === 'draw') { if (!NS.hasInk || !pad) { toast('Draw your signature first.'); return; } c = trimCanvas(pad, Math.round(5 * (window.devicePixelRatio || 1))); }
  else if (NS.mode === 'type') { if (!NS.typed.trim()) { toast('Type your name first.'); return; } c = await typedCanvas(); }
  else { if (!NS.upImg) { toast('Choose an image first.'); return; } c = trimCanvas(uploadCanvas(), 6); }
  if (!c) { toast('Nothing to save: the signature is empty. Try a lower clean-up value.'); return; }
  const name = NS.name.trim() || (NS.mode === 'type' ? NS.typed.trim() : `Signature ${sigs.length + 1}`);
  const s = { id: uid(), name, src: c.toDataURL('image/png'), aspect: c.width / c.height, kind: NS.mode };
  sigs.push(s); activeSig = s.id; saveSigs();
  closeSheet(); setTool('sign');
  toast(`Saved. Tap the page to place ${name}'s signature.`);
}

/* ---------------- file open / drop ---------------- */
async function openFile(f) {
  if (!f) return;
  if (!/pdf$/i.test(f.type) && !/\.pdf$/i.test(f.name)) { toast('Please choose a PDF file.'); return; }
  const buf = new Uint8Array(await f.arrayBuffer());
  await openPdf(buf, f.name);
}
$('#file').addEventListener('change', e => { openFile(e.target.files[0]); e.target.value = ''; });
let dragDepth = 0;
const hasFiles = e => e.dataTransfer && [...e.dataTransfer.types].includes('Files');
window.addEventListener('dragenter', e => { if (hasFiles(e)) { dragDepth++; $('#drop').hidden = false; e.preventDefault(); } });
window.addEventListener('dragover', e => { if (hasFiles(e)) e.preventDefault(); });
window.addEventListener('dragleave', () => { dragDepth = Math.max(0, dragDepth - 1); if (!dragDepth) $('#drop').hidden = true; });
window.addEventListener('drop', e => { e.preventDefault(); dragDepth = 0; $('#drop').hidden = true; if (e.dataTransfer.files[0]) openFile(e.dataTransfer.files[0]); });

/* ---------------- export ---------------- */
async function buildPdf() {
  const doc = await PDFDocument.load(pdfBytes, { ignoreEncryption: true });
  const font = await doc.embedFont(StandardFonts.Helvetica);
  const charset = new Set(font.getCharacterSet());
  const clean = s => [...s].map(ch => (ch === '\n' || charset.has(ch.codePointAt(0))) ? ch : '?').join('');
  const pp = doc.getPages();
  const imgCache = new Map();
  for (const it of S.items) {
    const page = pp[it.page]; if (!page) continue;
    const cb = page.getCropBox();
    const X = vx => cb.x + vx, Y = vy => cb.y + cb.height - vy;
    const color = pdfRgb(it.color || '#000000');
    if (it.type === 'text') {
      if (!it.text.trim()) continue;
      clean(it.text).split('\n').forEach((ln, i) => {
        if (ln) page.drawText(ln, { x: X(it.x), y: Y(it.y + it.size * 0.947 + i * it.size * 1.2), size: it.size, font, color });
      });
    } else if (it.type === 'sign') {
      let img = imgCache.get(it.src);
      if (!img) { img = await doc.embedPng(it.src); imgCache.set(it.src, img); }
      page.drawImage(img, { x: X(it.x), y: Y(it.y + it.h), width: it.w, height: it.h });
    } else {
      const k = it.w / 100;
      for (const [a, b] of MARK_PATHS[it.type]) {
        page.drawLine({
          start: { x: X(it.x + a[0] * k), y: Y(it.y + a[1] * k) },
          end: { x: X(it.x + b[0] * k), y: Y(it.y + b[1] * k) },
          thickness: 11 * k, color, lineCap: LineCapStyle.Round,
        });
      }
    }
  }
  return doc.save();
}
async function deliver(bytes, name) {
  const file = new File([bytes], name, { type: 'application/pdf' });
  // On phones, the share sheet lets you save to Files, mail it or send it in one step.
  if (matchMedia('(pointer:coarse)').matches && navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: name }); return; }
    catch (e) { if (e && e.name === 'AbortError') return; }
  }
  const url = URL.createObjectURL(file);
  const a = document.createElement('a'); a.href = url; a.download = name; document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
  toast('Downloaded ' + name);
}
$('#save').addEventListener('click', async () => {
  if (!pdfBytes) return;
  const ed = editingEl(); if (ed) ed.blur();
  const btn = $('#save'); btn.disabled = true;
  try {
    const bytes = await buildPdf();
    const name = (isSample ? 'sample-form' : fileName.replace(/\.pdf$/i, '') || 'document') + '-filled.pdf';
    await deliver(bytes, name);
  } catch (err) {
    console.error(err); toast('Could not build the PDF: ' + (err.message || err), 5000);
  } finally { btn.disabled = false; }
});

/* ---------------- sample form ---------------- */
async function makeSample() {
  const d = await PDFDocument.create();
  const p = d.addPage([612, 792]);
  const f = await d.embedFont(StandardFonts.Helvetica), fb = await d.embedFont(StandardFonts.HelveticaBold);
  const ink = rgb(.11, .12, .15), mute = rgb(.42, .44, .5), ln = rgb(.55, .57, .62);
  const text = (s, x, y, o = {}) => p.drawText(s, { x, y, size: 10, font: f, color: ink, ...o });
  const line = (x1, x2, y) => p.drawLine({ start: { x: x1, y }, end: { x: x2, y }, thickness: .7, color: ln });
  const box = (x, y) => p.drawRectangle({ x, y, width: 11, height: 11, borderColor: ink, borderWidth: .9 });
  p.drawRectangle({ x: 56, y: 742, width: 500, height: 3, color: rgb(.23, .51, .96) });
  text('EQUIPMENT LOAN AGREEMENT', 56, 716, { size: 16, font: fb });
  text('Form EQ-104  ·  Rev. 03', 56, 700, { size: 9, color: mute });
  text('1.  Borrower', 56, 664, { font: fb, size: 11 });
  const field = (label, x, y, x2) => { text(label, x, y, { size: 9, color: mute }); line(x + 78, x2, y - 2); };
  field('Full name', 56, 636, 556);
  field('Department', 56, 608, 300); field('Employee ID', 316, 608, 556);
  field('Email', 56, 580, 556);
  text('2.  Items borrowed', 56, 540, { font: fb, size: 11 });
  [['Laptop', 56, 512], ['Monitor', 220, 512], ['Headset', 384, 512], ['Docking station', 56, 486], ['Keyboard & mouse', 220, 486], ['Other:', 384, 486]]
    .forEach(([l, x, y]) => { box(x, y); text(l, x + 18, y + 2); });
  line(424, 556, 486);
  text('3.  Agreement', 56, 446, { font: fb, size: 11 });
  ['I confirm the items above are in working order on receipt. I will return them in the same',
   'condition by the end of my assignment, or sooner on request, and report loss or damage',
   'within two business days.'].forEach((s, i) => text(s, 56, 424 - i * 14, { color: mute }));
  box(56, 368); text('I have read and agree to the terms above.', 74, 370);
  box(56, 346); text('Send me a copy of this agreement by email.', 74, 348);
  line(56, 330, 270); line(370, 556, 270);
  text('Signature', 56, 256, { size: 9, color: mute }); text('Date', 370, 256, { size: 9, color: mute });
  return d.save();
}

/* ---------------- start ---------------- */
setTool('select');
makeSample().then(b => openPdf(new Uint8Array(b), 'Sample form.pdf', true))
  .catch(e => { console.error(e); pagesEl.innerHTML = '<div class="empty">Open a PDF to start.</div>'; });

// Installed on a computer, "Open with Filler" on a .pdf lands here.
if ('launchQueue' in window) window.launchQueue.setConsumer(async p => { if (p.files && p.files.length) openFile(await p.files[0].getFile()); });

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
})();
